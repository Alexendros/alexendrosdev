packages:
  - '.'

allowBuilds:
  esbuild: true
  sharp: true

# pnpm 9 (CI) lee estos overrides en package.json. pnpm 11 lee esta copia.
# Las dos listas tienen que ser idénticas al bloque overrides del lockfile.
overrides:
  'proxy-addr@>=2.0.0 <2.0.8': '2.0.8'
  'devalue@>=5.0.0 <5.9.3': '5.9.3'
  'compression@>=1.0.0 <1.8.2': '1.8.2'
  'source-map-js@>=1.0.0 <1.2.2': '1.2.2'
  'brace-expansion@>=1.0.0 <1.1.21': '1.1.21'
  'brace-expansion@>=5.0.0 <5.0.12': '5.0.12'
  'qs@>=6.0.0 <6.16.0': '6.16.0'
  'ip-address@>=10.0.0 <10.7.1': '10.7.1'
  'fast-uri@>=3.0.0 <3.1.8': '3.1.8'
  'sharp@>=0.33.0 <0.35.0': '0.35.5'
  'path-to-regexp@>=6.0.0 <6.3.0': '6.3.0'
